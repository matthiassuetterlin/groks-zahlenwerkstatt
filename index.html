<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F1EA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zahlenwerkstatt">
  <meta name="description" content="Grok’s Zahlenwerkstatt – Zahlen bis 100 in Fünfern und Zehnern sehen, statt zu zählen.">
  <title>Grok’s Zahlenwerkstatt</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preload" href="fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Falls das Stylesheet einmal nicht lädt (z. B. kurzer 503 direkt nach einem Deploy):
    // bis zu 3-mal mit frischer URL neu laden, statt eine ungestylte Seite zu zeigen.
    window.GZW_VERSION = '2';
    window.gzwRetryCss = function (link) {
      var n = (+link.dataset.retry || 0) + 1;
      if (n > 3) return;
      setTimeout(function () {
        var fresh = link.cloneNode();
        fresh.dataset.retry = n;
        fresh.href = 'css/style.css?v=' + window.GZW_VERSION + '&r=' + Date.now();
        link.replaceWith(fresh);
      }, 400 * n);
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=2" onerror="gzwRetryCss(this)">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Startseite">
      <img src="favicon.svg" alt="" width="36" height="36">
      <span>Grok’s <b>Zahlenwerkstatt</b></span>
    </a>
    <nav class="nav" aria-label="Hauptmenü">
      <a href="#/werkstatt" data-page="werkstatt">Werkstatt</a>
      <a href="#/lernen" data-page="lernen">Lernen</a>
    </nav>
  </header>
  <main id="app"></main>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module" src="js/main.js?v=2"></script>
</body>
</html>
