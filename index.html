<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A181A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Zahlenwerkstatt">
  <meta name="description" content="Grok’s Zahlenwerkstatt – Zahlen bis 100 in Fünfern und Zehnern sehen, statt zu zählen.">
  <title>Grok’s Zahlenwerkstatt</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="favicon.svg">
  <link rel="preload" href="fonts/figtree-var.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Einstellungen (Farbwelt, Schrift, Größe) sofort anwenden – kein Aufblitzen der Standardfarben.
    (function () {
      var s = {};
      try { s = (JSON.parse(localStorage.getItem('gzw.v1')) || {}).settings || {}; } catch (e) {}
      var d = document.documentElement;
      // ältere Werte (v1–v6) auf die v7-Auswahl abbilden – gleiche Tabelle wie js/settings.js (LEGACY)
      var T = { kakao: 'nacht', hell: 'salbei', leinen: 'salbei', morgen: 'rose', sand: 'salbei', nebel: 'rose' };
      var F = { andika: 'figtree', nunito: 'figtree', lexend: 'outfit', fredoka: 'outfit', atkinson: 'dmsans' };
      var Z = { s: 'k', m: 'l' };
      d.setAttribute('data-theme', T[s.theme] || s.theme || 'nacht');
      d.setAttribute('data-font', F[s.font] || s.font || 'figtree');
      d.setAttribute('data-size', Z[s.size] || s.size || 'l');
    })();
    // Falls das Stylesheet einmal nicht lädt (z. B. kurzer 503 direkt nach einem Deploy):
    // bis zu 3-mal mit frischer URL neu laden, statt eine ungestylte Seite zu zeigen.
    window.GZW_VERSION = '6';
    window.gzwRetryCss = function (link) {
      var n = (+link.dataset.retry || 0) + 1;
      if (n > 3) return;
      setTimeout(function () {
        var fresh = link.cloneNode();
        fresh.dataset.retry = n;
        fresh.href = 'css/style.css?v=' + window.GZW_VERSION + '&r=' + Date.now();
        link.replaceWith(fresh);
      }, 400 * n);
    };
  </script>
  <link rel="stylesheet" href="css/style.css?v=6" onerror="gzwRetryCss(this)">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Startseite">
      <img src="favicon.svg" alt="" width="36" height="36">
      <span class="brand-text">Grok’s <b>Zahlenwerkstatt</b></span>
    </a>
    <nav class="nav" aria-label="Hauptmenü">
      <a href="#/werkstatt" data-page="werkstatt"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="4.4" rx="2.2"/><rect x="3" y="10" width="18" height="4.4" rx="2.2"/><circle cx="6" cy="18.6" r="2.2"/><circle cx="11" cy="18.6" r="2.2"/></svg><span>Werkstatt</span></a>
      <a href="#/lernen" data-page="lernen"><svg class="nav-ico" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="2.4"/><rect x="13" y="3" width="8" height="8" rx="2.4"/><rect x="3" y="13" width="8" height="8" rx="2.4"/><rect x="13" y="13" width="8" height="8" rx="2.4"/></svg><span>Lernen</span></a>
    </nav>
  </header>
  <main id="app"></main>
  <noscript>Bitte JavaScript aktivieren.</noscript>
  <script type="module" src="js/main.js?v=6"></script>
</body>
</html>
